parameters:
    command_timeout: 300
    tasks:
        phpstan:
            configuration: phpstan.neon
            memory_limit: 1G
        phpunit:
            config_file: phpunit.xml
        phpcsfixer:
            config: .php-cs-fixer.dist.php
            allow_risky: true
        phparkitect:
            config: phparkitect.php
        rector:
            config: rector.php
            triggered_by: ['php']
