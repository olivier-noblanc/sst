# GrumPHP pre-commit — fast local feedback only.
# Heavy tasks (phpunit, phparkitect, rector, deptrac) are run by CI.
parameters:
    command_timeout: 120
    tasks:
        phpstan:
            configuration: phpstan.neon
            memory_limit: 1G
        phpcsfixer:
            config: .php-cs-fixer.dist.php
            allow_risky: true
