<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SST DREETS BFC — Nouveau signalement RSST</title>
<style>
  :root {
    --color-primary: #0056A3;
    --color-primary-dark: #003D75;
    --rsst-color: #2E5C8A;
    --rami-color: #6C6C6C;
    --dgi-color: #B22222;
    --state-nouveau: #2E5C8A;
    --state-en-cours: #E67E22;
    --state-traite: #27AE60;
    --state-abandonne: #95A5A6;
    --role-agent: #2E5C8A;
    --role-superviseur: #B22222;
    --role-chsct: #8E44AD;
    --font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    --sidebar-bg: #2C3E50;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: var(--font-family);
    background: #EBEEF3;
    color: #2C3E50;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ── Header ── */
  .app-header {
    background: linear-gradient(135deg, var(--color-primary-dark) 0%, var(--color-primary) 100%);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 24px;
    height: 56px;
    box-shadow: 0 2px 8px rgba(0,0,0,.25);
    position: relative;
    z-index: 10;
  }
  .app-header .logo-area {
    display: flex; align-items: center; gap: 12px;
  }
  .app-header .logo-icon {
    width: 36px; height: 36px;
    background: rgba(255,255,255,.15);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; font-weight: 700;
  }
  .app-header h1 {
    font-size: 18px; font-weight: 600; letter-spacing: .3px;
  }
  .app-header h1 span { opacity: .7; font-weight: 400; }
  .header-right {
    display: flex; align-items: center; gap: 16px; font-size: 13px;
  }
  .header-right .role-badge {
    background: rgba(255,255,255,.15);
    padding: 4px 12px; border-radius: 12px; font-size: 12px;
  }
  .header-right .user-name { font-weight: 600; }

  /* ── Layout ── */
  .layout {
    display: flex;
    flex: 1;
    min-height: calc(100vh - 56px);
  }

  /* ── Sidebar ── */
  .sidebar {
    width: 240px;
    background: var(--sidebar-bg);
    color: #ccc;
    padding: 16px 0;
    flex-shrink: 0;
  }
  .sidebar .nav-section {
    padding: 8px 20px 6px;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1.2px;
    color: #7f8c9b;
    font-weight: 600;
  }
  .sidebar .nav-item {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 20px; font-size: 14px;
    cursor: pointer;
    transition: background .15s, color .15s;
    border-left: 3px solid transparent;
  }
  .sidebar .nav-item:hover {
    background: rgba(255,255,255,.06); color: #fff;
  }
  .sidebar .nav-item.active {
    background: rgba(255,255,255,.08);
    color: #fff;
    border-left-color: #3498DB;
  }
  .sidebar .nav-icon { width: 20px; text-align: center; font-size: 16px; }
  .sidebar .nav-item .badge {
    margin-left: auto;
    background: #E74C3C; color: #fff;
    font-size: 11px; padding: 1px 7px;
    border-radius: 10px; font-weight: 600;
  }

  /* ── Main ── */
  .main {
    flex: 1;
    padding: 28px 32px;
    overflow-y: auto;
  }

  /* ── Breadcrumb ── */
  .breadcrumb {
    font-size: 13px;
    color: #7f8c8d;
    margin-bottom: 20px;
  }
  .breadcrumb a { color: var(--rsst-color); text-decoration: none; }
  .breadcrumb a:hover { text-decoration: underline; }
  .breadcrumb .sep { margin: 0 6px; }

  /* ── Form Card ── */
  .form-card {
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 2px 10px rgba(0,0,0,.08);
    overflow: hidden;
    max-width: 820px;
  }
  .form-card-header {
    background: var(--rsst-color);
    color: #fff;
    padding: 18px 24px;
    display: flex; align-items: center; gap: 12px;
  }
  .form-card-header .header-icon {
    width: 38px; height: 38px;
    background: rgba(255,255,255,.18);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
  }
  .form-card-header h2 {
    font-size: 18px; font-weight: 600;
  }
  .form-card-header .registry-tag {
    margin-left: auto;
    background: rgba(255,255,255,.2);
    padding: 4px 12px;
    border-radius: 6px;
    font-size: 12px; font-weight: 700;
    letter-spacing: .5px;
  }

  .form-card-body {
    padding: 28px 24px;
  }

  /* ── Form Elements ── */
  .form-row {
    display: flex; gap: 18px; margin-bottom: 20px;
  }
  .form-group {
    display: flex; flex-direction: column; flex: 1;
  }
  .form-group.half { flex: 0 0 calc(50% - 9px); }
  .form-group label {
    font-size: 13px; font-weight: 600;
    color: #4a5568;
    margin-bottom: 6px;
  }
  .form-group label .required {
    color: #E74C3C; margin-left: 2px;
  }
  .form-group input,
  .form-group select,
  .form-group textarea {
    font-family: var(--font-family);
    font-size: 14px;
    padding: 10px 14px;
    border: 1.5px solid #CBD5E0;
    border-radius: 8px;
    background: #FAFBFC;
    color: #2C3E50;
    transition: border-color .15s, box-shadow .15s;
    outline: none;
  }
  .form-group input:focus,
  .form-group select:focus,
  .form-group textarea:focus {
    border-color: var(--rsst-color);
    box-shadow: 0 0 0 3px rgba(46,92,138,.12);
    background: #fff;
  }
  .form-group textarea {
    resize: vertical;
    min-height: 110px;
    line-height: 1.5;
  }
  .form-group .file-upload {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 14px;
    border: 1.5px dashed #CBD5E0;
    border-radius: 8px;
    background: #FAFBFC;
    cursor: pointer;
    font-size: 13px; color: #718096;
    transition: border-color .15s;
  }
  .form-group .file-upload:hover {
    border-color: var(--rsst-color);
  }
  .form-group .file-upload .upload-icon {
    font-size: 18px; color: var(--rsst-color);
  }

  /* ── Form Actions ── */
  .form-actions {
    display: flex; gap: 14px;
    justify-content: flex-end;
    padding-top: 8px;
    border-top: 1px solid #EDF2F7;
    margin-top: 8px;
    padding-top: 22px;
  }
  .btn {
    font-family: var(--font-family);
    font-size: 14px;
    font-weight: 600;
    padding: 11px 24px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    display: inline-flex; align-items: center; gap: 8px;
    transition: filter .15s, transform .08s;
  }
  .btn:active { transform: scale(.98); }
  .btn-primary {
    background: var(--rsst-color);
    color: #fff;
  }
  .btn-primary:hover { filter: brightness(1.1); }
  .btn-secondary {
    background: #EDF2F7;
    color: #4a5568;
  }
  .btn-secondary:hover { background: #E2E8F0; }
</style>
</head>
<body>

<!-- ═══ Header ═══ -->
<header class="app-header">
  <div class="logo-area">
    <div class="logo-icon">S</div>
    <h1>SST DREETS <span>BFC</span></h1>
  </div>
  <div class="header-right">
    <span class="role-badge">Agent</span>
    <span class="user-name">Jean Martin</span>
  </div>
</header>

<div class="layout">

  <!-- ═══ Sidebar ═══ -->
  <nav class="sidebar">
    <div class="nav-section">Navigation</div>
    <div class="nav-item">
      <span class="nav-icon">&#9776;</span> Accueil
    </div>
    <div class="nav-item active">
      <span class="nav-icon">&#9998;</span> RSST
      <span class="badge">3</span>
    </div>
    <div class="nav-item">
      <span class="nav-icon">&#9888;</span> RAMI
      <span class="badge">5</span>
    </div>
    <div class="nav-item">
      <span class="nav-icon">&#9889;</span> DGI
      <span class="badge">1</span>
    </div>

    <div class="nav-section" style="margin-top:16px;">Mon compte</div>
    <div class="nav-item">
      <span class="nav-icon">&#9786;</span> Mon profil
    </div>
    <div class="nav-item">
      <span class="nav-icon">&#9881;</span> Paramètres
    </div>
    <div class="nav-item">
      <span class="nav-icon">&#10149;</span> Déconnexion
    </div>
  </nav>

  <!-- ═══ Main Content ═══ -->
  <main class="main">

    <div class="breadcrumb">
      <a href="#">Accueil</a><span class="sep">›</span><a href="#">RSST</a><span class="sep">›</span>Nouveau signalement
    </div>

    <div class="form-card">
      <div class="form-card-header">
        <div class="header-icon">+</div>
        <h2>Nouveau signalement RSST</h2>
        <span class="registry-tag">RSST</span>
      </div>
      <div class="form-card-body">
        <form>

          <!-- Date & Heure -->
          <div class="form-row">
            <div class="form-group half">
              <label>Date de l'événement <span class="required">*</span></label>
              <input type="date" value="2025-06-10">
            </div>
            <div class="form-group half">
              <label>Heure de l'événement <span class="required">*</span></label>
              <input type="time" value="14:30">
            </div>
          </div>

          <!-- Lieu -->
          <div class="form-row">
            <div class="form-group">
              <label>Lieu <span class="required">*</span></label>
              <input type="text" value="Bâtiment principal, 2e étage, escalier B">
            </div>
          </div>

          <!-- Objet -->
          <div class="form-row">
            <div class="form-group">
              <label>Objet <span class="required">*</span></label>
              <input type="text" value="Rampe d'escalier desserrée — risque de chute">
            </div>
          </div>

          <!-- Description -->
          <div class="form-row">
            <div class="form-group">
              <label>Description <span class="required">*</span></label>
              <textarea>La rampe de l'escalier B au 2e étage est desserrée à plusieurs endroits. Un agent a failli chuter en s'y appuyant. Une intervention rapide du service technique est nécessaire pour éviter un accident.</textarea>
            </div>
          </div>

          <!-- Unité départementale -->
          <div class="form-row">
            <div class="form-group">
              <label>Unité départementale <span class="required">*</span></label>
              <select>
                <option>UR21 — Côte-d'Or</option>
                <option>UR25 — Doubs</option>
                <option>UR39 — Jura</option>
                <option>UR58 — Nièvre</option>
                <option>UR70 — Haute-Saône</option>
                <option>UR71 — Saône-et-Loire</option>
                <option>UR89 — Yonne</option>
                <option>UR90 — Territoire de Belfort</option>
              </select>
            </div>
          </div>

          <!-- Pièce jointe -->
          <div class="form-row">
            <div class="form-group">
              <label>Pièce jointe</label>
              <div class="file-upload">
                <span class="upload-icon">&#128206;</span>
                Cliquer ou déposer un fichier (PDF, JPG, PNG — max 10 Mo)
              </div>
            </div>
          </div>

          <!-- Actions -->
          <div class="form-actions">
            <button type="button" class="btn btn-secondary">Annuler</button>
            <button type="submit" class="btn btn-primary">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 8.5 6.5 12 13 4"/></svg>
              Enregistrer le signalement
            </button>
          </div>

        </form>
      </div>
    </div>

  </main>
</div>

</body>
</html>
