deptrac:
  paths:
    - src/
    - handlers/
    - pages/
    - templates/

  layers:
    - name: Enum
      collectors:
        - type: directory
          value: src/Enum/*

    - name: DTO
      collectors:
        - type: directory
          value: src/DTO/*

    - name: Query
      collectors:
        - type: directory
          value: src/Query/*

    - name: Repository
      collectors:
        - type: directory
          value: src/Repository/*

    - name: Service
      collectors:
        - type: directory
          value: src/Services/*

    - name: Event
      collectors:
        - type: directory
          value: src/Event/*

    - name: Router
      collectors:
        - type: directory
          value: src/Router/*

    - name: Container
      collectors:
        - type: directory
          value: src/Container/*

    - name: Helpers
      collectors:
        - type: directory
          value: src/helpers/*

    - name: Rector
      collectors:
        - type: directory
          value: src/Rector/*

    - name: PHPStan
      collectors:
        - type: directory
          value: src/PHPStan/*

    - name: Handler
      collectors:
        - type: directory
          value: handlers/*

    - name: Page
      collectors:
        - type: directory
          value: pages/*

    - name: Template
      collectors:
        - type: directory
          value: templates/*

  ruleset:
    Enum:
      - DTO

    DTO:
      - Enum

    Query:
      - Enum
      - DTO
      - Repository

    Repository:
      - Enum
      - DTO
      - Query

    Service:
      - Enum
      - DTO
      - Repository
      - Query
      - Event

    Event:
      - Enum
      - DTO
      # Audit #60 (deptrac) — event_listeners.php est responsable de lier les
      # events métier aux services de notification. Sans dépendre de Service et
      # de Container, l'Event layer ne pourrait rien faire (il serait une
      # abstraction morte). L'autorisation est explicite et documentée.
      - Service
      - Container

    Helpers:
      - Enum
      - DTO
      - Service

    Rector:
      - Enum

    Router:
      - Enum
      - Service

    PHPStan:
      - Enum

    # Handlers : controllers thin — accèdent aux Services et Enums
    Handler:
      - Enum
      - DTO
      - Service
      - Repository

    # Pages : vue + logique légère — accèdent aux Services et Enums
    Page:
      - Enum
      - DTO
      - Service
      - Repository

    # Templates : affichage pur — accèdent aux Helpers, Enums et Services
    Template:
      - Enum
      - Helpers
      - Service
