; .user.ini — Application SST DREETS BFC
;
; Sans ce fichier, les valeurs par défaut de PHP (post_max_size=8M,
; upload_max_filesize=2M) sont plus basses que MAX_ATTACHMENT_SIZE
; (10 Mo, défini dans src/config.php et annoncé aux utilisateurs).
; Résultat : toute requête dont le corps dépasse post_max_size est
; silencieusement vidée par PHP avant même d'atteindre le code de
; l'application ($_POST et $_FILES deviennent vides, sans erreur ni
; log) — les signalements avec pièce jointe échouaient sans aucune
; trace exploitable.
;
; Repris par PHP automatiquement pour les SAPI CGI/FastCGI (IIS),
; pas de redémarrage du service requis (délai de cache : voir
; user_ini.cache_ttl, 300s par défaut).

post_max_size = 12M
upload_max_filesize = 10M
