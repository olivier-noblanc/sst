name: CI

# Filet de sécurité en amont du gate local (update_sst.ps1). Couvre ce
# qui est reproductible sur un runner cloud : lint, PHPStan, PHPUnit,
# PHPArkitect, Rector, et Playwright avec Firefox (mode DEV_MODE / mock login).
#
# NE couvre PAS le projet Playwright "msedge" (authentification Windows
# intégrée contre IIS) : un runner GitHub Actions est une VM éphémère
# non jointe au domaine AD, sans ticket Kerberos ni cache d'identifiants
# NTLM — le SSO Windows ne peut pas fonctionner ici, quel que soit le
# navigateur installé. Ce cas reste uniquement testable par le gate
# local (update_sst.ps1) sur la vraie machine Windows/IIS.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Lint + PHPStan + PHPUnit + PHPArkitect + Rector
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.5
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: sqlite3, pdo_sqlite, mbstring, intl, bcmath, curl, zip, opcache
          coverage: none

      - name: Composer install
        run: composer install --no-interaction --prefer-dist

      - name: Lint (php -l)
        run: |
          set -e
          find src pages handlers templates tools public -name '*.php' -print0 \
            | xargs -0 -n1 php -l

      - name: PHPStan
        run: php vendor/bin/phpstan analyse --memory-limit=1G --no-progress

      - name: PHPUnit
        run: php vendor/bin/phpunit --no-coverage 2>&1 | tee phpunit-output.txt

      - name: Diagnose FTS5 "malformed" warning
        if: always()
        run: |
          COUNT=$(grep -c "database disk image is malformed" phpunit-output.txt || true)
          echo "malformed_count=$COUNT" >> "$GITHUB_STEP_SUMMARY"
          echo "## FTS5 'malformed' diagnostic" >> "$GITHUB_STEP_SUMMARY"
          echo "Occurrences: $COUNT" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "PHP: $(php -v | head -1)" >> "$GITHUB_STEP_SUMMARY"
          echo "SQLite (pdo_sqlite): $(php -r 'echo (new PDO("sqlite::memory:"))->query("SELECT sqlite_version()")->fetchColumn();')" >> "$GITHUB_STEP_SUMMARY"
          echo "sqlite3 ext version: $(php -r 'echo (new SQLite3(":memory:"))->querySingle("SELECT sqlite_version()");')" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          php -m | grep -i sqlite >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          if [ "$COUNT" -gt 0 ]; then
            echo "::warning::FTS5 'database disk image is malformed' seen $COUNT time(s) in this PHPUnit run — see step summary for environment details."
            echo "### First 3 occurrences with context" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            grep -B2 "database disk image is malformed" phpunit-output.txt | head -40 >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: PHPArkitect
        run: php vendor/bin/phparkitect check --config=phparkitect.php

      - name: Rector (dry-run)
        run: php vendor/bin/rector process --dry-run --no-progress-bar --config=rector.php

  e2e:
    name: E2E (Playwright, Firefox)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.5
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: sqlite3, pdo_sqlite, mbstring, intl, bcmath, curl, zip, opcache
          coverage: none

      - name: Composer install
        run: composer install --no-interaction --prefer-dist

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: npm install
        run: npm install

      - name: Install Playwright (Firefox only)
        run: npx playwright install --with-deps firefox

      - name: Run E2E tests
        run: npx playwright test --project=firefox

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
