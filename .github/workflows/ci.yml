name: CI

# Filet de sécurité en amont du gate local (update_sst.ps1). Couvre ce
# qui est reproductible sur un runner cloud : lint, PHPStan, PHPUnit,
# PHPArkitect, Rector, Deptrac, Infection, checkers custom, et Playwright
# avec Firefox (mode DEV_MODE / mock login).
#
# NE couvre PAS le projet Playwright "msedge" (authentification Windows
# intégrée contre IIS) : un runner GitHub Actions est une VM éphémère
# non jointe au domaine AD, sans ticket Kerberos ni cache d'identifiants
# NTLM — le SSO Windows ne peut pas fonctionner ici, quel que soit le
# navigateur installé. Ce cas reste uniquement testable par le gate
# local (update_sst.ps1) sur la vraie machine Windows/IIS.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint + PHPStan + PHPUnit + PHPArkitect + Rector + Deptrac
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    defaults:
      run:
        # Audit #81 — every failure-detecting step here pipes into `tee` for
        # the commit-comment mechanism (cmd 2>&1 | tee file). Without
        # pipefail, bash's pipeline exit status is that of the LAST command
        # (tee, which almost never fails) — not cmd's. Confirmed empirically:
        # the PHPStan step reported "success" on a run whose own
        # phpstan-output.txt read "[ERROR] Found 96 errors". set -e alone
        # does not fix this — it only aborts on a pipeline's own exit status,
        # which was already the (wrong) success from tee. Explicit here
        # rather than relying on the runner's default shell flags, which
        # turned out not to behave as assumed.
        shell: bash --noprofile --norc -eo pipefail {0}
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.5
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: sqlite3, pdo_sqlite, mbstring, intl, bcmath, curl, zip, opcache
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ runner.os }}-php85-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php85-

      - name: Composer install
        run: composer install --no-interaction --prefer-dist

      - name: Lint (php -l)
        run: |
          set -e
          (find src pages handlers templates tools public -name '*.php' -print0 \
            | xargs -0 -n1 php -l) 2>&1 | tee lint-output.txt

      - name: PHPStan
        run: php vendor/bin/phpstan analyse --memory-limit=1G --no-progress 2>&1 | tee phpstan-output.txt

      - name: PHPStan (tests/)
        run: php vendor/bin/phpstan analyse --configuration=phpstan-tests.neon --memory-limit=1G --no-progress 2>&1 | tee phpstan-tests-output.txt

      - name: PHPUnit
        run: php vendor/bin/phpunit --no-coverage --debug 2>&1 | tee phpunit-output.txt

      - name: Diagnose FTS5 "malformed" warning
        if: always()
        run: |
          COUNT=$(grep -c "database disk image is malformed" phpunit-output.txt || true)
          if [ "$COUNT" -gt 0 ]; then
            SQLITE_VER=$(php -r 'echo (new PDO("sqlite::memory:"))->query("SELECT sqlite_version()")->fetchColumn();')
            FIRST_LINE=$(grep -n -m1 "database disk image is malformed" phpunit-output.txt | cut -d: -f1)
            START=$((FIRST_LINE - 15))
            [ $START -lt 1 ] && START=1
            CONTEXT=$(sed -n "${START},$((FIRST_LINE))p" phpunit-output.txt | grep -E "^Test|malformed" | tr '\n' '|')
            echo "::warning::FTS5 malformed x$COUNT — PHP $(php -r 'echo PHP_VERSION;') SQLite $SQLITE_VER — context before 1st: $CONTEXT"
          else
            echo "::notice::FTS5 malformed: 0 occurrences this run."
          fi

      - name: PHPArkitect
        run: php vendor/bin/phparkitect check --config=phparkitect.php

      - name: Rector (dry-run)
        run: php vendor/bin/rector process --dry-run --no-progress-bar --config=rector.php 2>&1 | tee rector-output.txt

      - name: Deptrac
        run: php vendor/bin/deptrac analyse --no-progress

      - name: Check inline styles (CSP compliance)
        run: php tools/check_inline_styles.php

      - name: Check CSS classes (no undefined classes)
        run: php tools/check_css_classes.php --missing

      - name: Report failure as commit comment
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          {
            echo "### ❌ CI \"quality\" a échoué — commit \`${GITHUB_SHA::8}\`"
            for f in lint-output.txt phpstan-output.txt phpstan-tests-output.txt phpunit-output.txt rector-output.txt; do
              if [ -s "$f" ]; then
                echo ""
                if [ "$f" = "phpunit-output.txt" ] && grep -qE "Premature end|PHP Fatal error" "$f"; then
                  echo "<details><summary>$f — contexte autour du crash (200 lignes avant/après)</summary>"
                  echo ""
                  echo '```'
                  # Audit #82 — head -1 on a bare "Fatal error" grep can match
                  # CHANGELOG.md text quoted inside a test's own output (not a
                  # real crash), truncating the extraction window long before
                  # the actual PHPUnit summary further down. Anchor on the
                  # more specific "PHP Fatal error" (the real crash marker)
                  # and prefer the LAST occurrence — closer to where the
                  # process actually died.
                  CRASH_LINE=$(grep -nE "Premature end|PHP Fatal error" "$f" | tail -1 | cut -d: -f1)
                  START=$((CRASH_LINE - 200)); [ $START -lt 1 ] && START=1
                  END=$((CRASH_LINE + 30))
                  sed -n "${START},${END}p" "$f"
                  echo '```'
                  echo "</details>"
                  echo ""
                fi
                # Audit #82 — always show the tail too: that's where PHPUnit's
                # own summary (OK / FAILURES! / Tests: N, Assertions: N) lives,
                # regardless of whether a crash pattern was found above.
                if [ "$f" = "phpunit-output.txt" ]; then
                  echo "<details><summary>$f (dernières 150 lignes — résumé)</summary>"
                  echo ""
                  echo '```'
                  tail -n 150 "$f"
                  echo '```'
                  echo "</details>"
                else
                  echo "<details><summary>$f (dernières 200 lignes)</summary>"
                  echo ""
                  echo '```'
                  tail -n 200 "$f"
                  echo '```'
                  echo "</details>"
                fi
              fi
            done
            echo ""
            echo "[Run complet]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)"
          } > /tmp/comment_body.md

          python3 -c "
          import json
          body = open('/tmp/comment_body.md').read()
          if len(body) > 65000:
              body = body[:65000] + '\n\n...(tronqué)'
          print(json.dumps({'body': body}))
          " > /tmp/comment_payload.json

          curl -s -X POST \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/comments" \
            -d @/tmp/comment_payload.json

  e2e:
    name: E2E (Playwright, Firefox)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.5
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: sqlite3, pdo_sqlite, mbstring, intl, bcmath, curl, zip, opcache
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ runner.os }}-php85-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php85-

      - name: Composer install
        run: composer install --no-interaction --prefer-dist

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: npm install
        run: npm install

      - name: Install Playwright (Firefox only)
        run: npx playwright install --with-deps firefox

      - name: Create session directory
        run: mkdir -p /tmp/php_sessions

      - name: Run E2E tests
        run: npx playwright test --project=firefox

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
