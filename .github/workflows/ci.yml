name: CI

# Filet de sécurité en amont du gate local (update_sst.ps1). Couvre ce
# qui est reproductible sur un runner cloud : lint, PHPStan, PHPUnit,
# PHPArkitect, Rector, Deptrac, Infection, checkers custom, et Playwright
# avec Firefox (mode DEV_MODE / mock login).
#
# NE couvre PAS le projet Playwright "msedge" (authentification Windows
# intégrée contre IIS) : un runner GitHub Actions est une VM éphémère
# non jointe au domaine AD, sans ticket Kerberos ni cache d'identifiants
# NTLM — le SSO Windows ne peut pas fonctionner ici, quel que soit le
# navigateur installé. Ce cas reste uniquement testable par le gate
# local (update_sst.ps1) sur la vraie machine Windows/IIS.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-phpstan:
    name: Lint + PHPStan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    defaults:
      run:
        # Audit #81 — voir commit e29d2e3 : sans pipefail explicite,
        # `cmd | tee fichier` remonte le exit code de tee (~toujours 0),
        # pas celui de cmd. Répété sur chaque job depuis le split (Audit
        # #84) — ce n'est pas hérité automatiquement d'un job à l'autre.
        shell: bash --noprofile --norc -eo pipefail {0}
    steps:
      - uses: actions/checkout@v5

      - name: Setup PHP 8.5
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: sqlite3, pdo_sqlite, mbstring, intl, bcmath, curl, zip, opcache
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: vendor
          key: composer-${{ runner.os }}-php85-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php85-

      - name: Composer install
        run: composer install --no-interaction --prefer-dist

      - name: Lint (php -l)
        run: |
          set -e
          (find src pages handlers templates tools public -name '*.php' -print0 \
            | xargs -0 -n1 php -l) 2>&1 | tee lint-output.txt

      - name: PHPStan
        run: php vendor/bin/phpstan analyse --memory-limit=1G --no-progress 2>&1 | tee phpstan-output.txt

      - name: PHPStan (tests/)
        run: php vendor/bin/phpstan analyse --configuration=phpstan-tests.neon --memory-limit=1G --no-progress 2>&1 | tee phpstan-tests-output.txt

      - name: Report failure as commit comment
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          {
            echo "### ❌ CI \"Lint + PHPStan\" a échoué — commit \`${GITHUB_SHA::8}\`"
            for f in lint-output.txt phpstan-output.txt phpstan-tests-output.txt; do
              if [ -s "$f" ]; then
                echo ""
                echo "<details><summary>$f (dernières 200 lignes)</summary>"
                echo ""
                echo '```'
                tail -n 200 "$f"
                echo '```'
                echo "</details>"
              fi
            done
            echo ""
            echo "[Run complet]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)"
          } > /tmp/comment_body.md

          python3 -c "
          import json
          body = open('/tmp/comment_body.md').read()
          if len(body) > 65000:
              body = body[:65000] + '\n\n...(tronqué)'
          print(json.dumps({'body': body}))
          " > /tmp/comment_payload.json

          curl -s -X POST \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/comments" \
            -d @/tmp/comment_payload.json

  phpunit:
    name: PHPUnit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    defaults:
      run:
        shell: bash --noprofile --norc -eo pipefail {0}
    steps:
      - uses: actions/checkout@v5

      - name: Setup PHP 8.5
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: sqlite3, pdo_sqlite, mbstring, intl, bcmath, curl, zip, opcache
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: vendor
          key: composer-${{ runner.os }}-php85-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php85-

      - name: Composer install
        run: composer install --no-interaction --prefer-dist

      - name: PHPUnit
        run: php vendor/bin/phpunit --no-coverage --log-junit=phpunit.junit.xml --debug 2>&1 | tee phpunit-output.txt

      - name: Publish Test Results
        uses: dorny/test-reporter@v3
        if: always()  # Run even if tests fail, so failures surface as annotations
        with:
          name: PHPUnit Results
          path: phpunit.junit.xml
          reporter: phpunit-junit

      - name: Diagnose FTS5 "malformed" warning
        if: always()
        run: |
          COUNT=$(grep -c "database disk image is malformed" phpunit-output.txt || true)
          if [ "$COUNT" -gt 0 ]; then
            SQLITE_VER=$(php -r 'echo (new PDO("sqlite::memory:"))->query("SELECT sqlite_version()")->fetchColumn();')
            FIRST_LINE=$(grep -n -m1 "database disk image is malformed" phpunit-output.txt | cut -d: -f1)
            START=$((FIRST_LINE - 15))
            [ $START -lt 1 ] && START=1
            CONTEXT=$(sed -n "${START},$((FIRST_LINE))p" phpunit-output.txt | grep -E "^Test|malformed" | tr '\n' '|')
            echo "::warning::FTS5 malformed x$COUNT — PHP $(php -r 'echo PHP_VERSION;') SQLite $SQLITE_VER — context before 1st: $CONTEXT"
          else
            echo "::notice::FTS5 malformed: 0 occurrences this run."
          fi

      - name: Report failure as commit comment
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          {
            echo "### ❌ CI \"PHPUnit\" a échoué — commit \`${GITHUB_SHA::8}\`"
            f=phpunit-output.txt
            if [ -s "$f" ]; then
              echo ""
              if grep -qE "Premature end|PHP Fatal error" "$f"; then
                echo "<details><summary>$f — contexte autour du crash (200 lignes avant/après)</summary>"
                echo ""
                echo '```'
                # Audit #82 — voir commit historique : ancrer sur "PHP Fatal
                # error" (marqueur réel) et prendre la DERNIÈRE occurrence,
                # pas la première (qui peut matcher du texte de CHANGELOG.md
                # cité dans un test, loin du vrai crash).
                CRASH_LINE=$(grep -nE "Premature end|PHP Fatal error" "$f" | tail -1 | cut -d: -f1)
                START=$((CRASH_LINE - 200)); [ $START -lt 1 ] && START=1
                END=$((CRASH_LINE + 30))
                sed -n "${START},${END}p" "$f"
                echo '```'
                echo "</details>"
                echo ""
              fi
              if grep -qE "^Test (Failed|Errored) \(" "$f"; then
                echo "<details><summary>$f — tests en échec (Test Failed/Errored, 40 lignes de contexte chacun)</summary>"
                echo ""
                echo '```'
                # Pas un crash fatal — juste une/des assertions ratées, noyées
                # dans les 1215 tests. Le fallback "dernières 150 lignes" ne les
                # montre que si elles tombent en toute fin de run, ce qui n'est
                # presque jamais le cas sur une suite de cette taille.
                grep -nE "^Test (Failed|Errored) \(" "$f" | cut -d: -f1 | while read -r LINE; do
                  END=$((LINE + 40))
                  sed -n "${LINE},${END}p" "$f"
                  echo "----"
                done
                echo '```'
                echo "</details>"
                echo ""
              fi
              echo "<details><summary>$f (dernières 150 lignes — résumé)</summary>"
              echo ""
              echo '```'
              tail -n 150 "$f"
              echo '```'
              echo "</details>"
            fi
            echo ""
            echo "[Run complet]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)"
          } > /tmp/comment_body.md

          python3 -c "
          import json
          body = open('/tmp/comment_body.md').read()
          if len(body) > 65000:
              body = body[:65000] + '\n\n...(tronqué)'
          print(json.dumps({'body': body}))
          " > /tmp/comment_payload.json

          curl -s -X POST \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/comments" \
            -d @/tmp/comment_payload.json

  static-analysis:
    name: PHPArkitect + Deptrac
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    defaults:
      run:
        shell: bash --noprofile --norc -eo pipefail {0}
    steps:
      - uses: actions/checkout@v5

      - name: Setup PHP 8.5
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: sqlite3, pdo_sqlite, mbstring, intl, bcmath, curl, zip, opcache
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: vendor
          key: composer-${{ runner.os }}-php85-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php85-

      - name: Composer install
        run: composer install --no-interaction --prefer-dist

      - name: PHPArkitect
        run: php vendor/bin/phparkitect check --config=phparkitect.php 2>&1 | tee phparkitect-output.txt

      - name: Deptrac
        run: php vendor/bin/deptrac analyse --no-progress 2>&1 | tee deptrac-output.txt

      - name: Report failure as commit comment
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          {
            echo "### ❌ CI \"PHPArkitect + Deptrac\" a échoué — commit \`${GITHUB_SHA::8}\`"
            for f in phparkitect-output.txt deptrac-output.txt; do
              if [ -s "$f" ]; then
                echo ""
                echo "<details><summary>$f (dernières 200 lignes)</summary>"
                echo ""
                echo '```'
                tail -n 200 "$f"
                echo '```'
                echo "</details>"
              fi
            done
            echo ""
            echo "[Run complet]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)"
          } > /tmp/comment_body.md

          python3 -c "
          import json
          body = open('/tmp/comment_body.md').read()
          if len(body) > 65000:
              body = body[:65000] + '\n\n...(tronqué)'
          print(json.dumps({'body': body}))
          " > /tmp/comment_payload.json

          curl -s -X POST \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/comments" \
            -d @/tmp/comment_payload.json

  csp-checks:
    name: CSP compliance (inline styles + CSS classes)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    defaults:
      run:
        shell: bash --noprofile --norc -eo pipefail {0}
    steps:
      - uses: actions/checkout@v5

      - name: Setup PHP 8.5
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: sqlite3, pdo_sqlite, mbstring, intl, bcmath, curl, zip, opcache
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: vendor
          key: composer-${{ runner.os }}-php85-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php85-

      - name: Composer install
        run: composer install --no-interaction --prefer-dist

      - name: Check inline styles (CSP compliance)
        run: php tools/check_inline_styles.php 2>&1 | tee inline-styles-output.txt

      - name: Check CSS classes (no undefined classes)
        run: php tools/check_css_classes.php --missing 2>&1 | tee css-classes-output.txt

      - name: Report failure as commit comment
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          {
            echo "### ❌ CI \"CSP compliance\" a échoué — commit \`${GITHUB_SHA::8}\`"
            for f in inline-styles-output.txt css-classes-output.txt; do
              if [ -s "$f" ]; then
                echo ""
                echo "<details><summary>$f (dernières 200 lignes)</summary>"
                echo ""
                echo '```'
                tail -n 200 "$f"
                echo '```'
                echo "</details>"
              fi
            done
            echo ""
            echo "[Run complet]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)"
          } > /tmp/comment_body.md

          python3 -c "
          import json
          body = open('/tmp/comment_body.md').read()
          if len(body) > 65000:
              body = body[:65000] + '\n\n...(tronqué)'
          print(json.dumps({'body': body}))
          " > /tmp/comment_payload.json

          curl -s -X POST \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/comments" \
            -d @/tmp/comment_payload.json

  # ── E2E Tests (Playwright, Firefox) — sharded for parallelism ───────────────────
  # Split into 3 shards to avoid timeout (each shard runs ~1/3 of tests in parallel)
  e2e:
    name: E2E (Playwright, Firefox)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1/3, 2/3, 3/3]
        shard-label: ["1-3", "2-3", "3-3"]
    steps:
      - uses: actions/checkout@v5

      - name: Setup PHP 8.5
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: sqlite3, pdo_sqlite, mbstring, intl, bcmath, curl, zip, opcache
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: vendor
          key: composer-${{ runner.os }}-php85-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php85-

      - name: Composer install
        run: composer install --no-interaction --prefer-dist

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: npm install
        run: npm install

      # tests/infra/PlaywrightConfigWindowsCommandTest.php needs node +
      # node_modules/@playwright/test: it cannot run in the PHPUnit job
      # (no node there), so it runs here, once per CI run, on shard 1/3.
      - name: Infra test — Playwright config Windows quoting
        if: matrix.shard == '1/3'
        run: php vendor/bin/phpunit --no-coverage tests/infra/PlaywrightConfigWindowsCommandTest.php

      - name: Install Playwright (Firefox only)
        run: npx playwright install --with-deps firefox

      - name: Run E2E tests (shard ${{ matrix.shard }})
        env:
          CI: true
        run: npx playwright test --project=firefox --shard=${{ matrix.shard }}

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-shard-${{ matrix.shard-label }}
          path: playwright-report/
          retention-days: 7

  # ── PHP CS Fixer (code style PER-CS) ─────────────────────────
  cs-fixer:
    name: PHP CS Fixer
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    defaults:
      run:
        shell: bash --noprofile --norc -eo pipefail {0}
    steps:
      - uses: actions/checkout@v5

      - name: Setup PHP 8.5
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: sqlite3, pdo_sqlite, mbstring, intl, bcmath, curl, zip, opcache
          coverage: none
          tools: composer

      - name: Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: vendor
          key: composer-${{ runner.os }}-php85-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php85-

      - name: Composer install
        run: composer install --no-interaction --prefer-dist

      - name: Check code style (dry-run)
        run: php vendor/bin/php-cs-fixer fix --dry-run --diff --show-progress=none --using-cache=no 2>&1 | tee cs-fixer-output.txt

      - name: Report failure as commit comment
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          {
            echo "### ❌ CI \"PHP CS Fixer\" a échoué — commit \`${GITHUB_SHA::8}\`"
            echo ""
            echo "<details><summary>cs-fixer-output.txt (dernières 200 lignes)</summary>"
            echo ""
            echo '```'
            tail -n 200 cs-fixer-output.txt
            echo '```'
            echo "</details>"
            echo ""
            echo "[Run complet]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)"
          } > /tmp/comment_body.md
          python3 -c "
          import json
          body = open('/tmp/comment_body.md').read()
          if len(body) > 65000:
              body = body[:65000] + '\n\n...(tronqué)'
          print(json.dumps({'body': body}))
          " > /tmp/comment_payload.json
          curl -s -X POST \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/comments" \
            -d @/tmp/comment_payload.json

  # ── Rector (modernisation PHP 8.5) ───────────────────────────
  # Job standalone : vérifie que le code est à jour des règles de
  # modernisation (PHP 8.5 : readonly, asymmetric visibility, typed
  # constants, first-class callable, etc.). Échec = Rector aurait
  # modifié des fichiers — il faut lancer `composer rector` localement
  # puis committer.
  rector:
    name: Rector (modernisation PHP 8.5)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    defaults:
      run:
        shell: bash --noprofile --norc -eo pipefail {0}
    steps:
      - uses: actions/checkout@v5

      - name: Setup PHP 8.5
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: sqlite3, pdo_sqlite, mbstring, intl, bcmath, curl, zip, opcache
          coverage: none
          tools: composer

      - name: Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: vendor
          key: composer-${{ runner.os }}-php85-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php85-

      - name: Composer install
        run: composer install --no-interaction --prefer-dist

      - name: Rector (dry-run)
        run: php vendor/bin/rector process --dry-run --no-progress-bar --config=rector.php 2>&1 | tee rector-output.txt

      - name: Report failure as commit comment
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          {
            echo "### ❌ CI \"Rector (modernisation)\" a échoué — commit \`${GITHUB_SHA::8}\`"
            echo ""
            echo "Rector détecte du code à moderniser (PHP 8.5). Lancer localement :"
            echo ""
            echo '```bash'
            echo 'composer rector'
            echo '```'
            echo ""
            echo "<details><summary>rector-output.txt (dernières 200 lignes)</summary>"
            echo ""
            echo '```'
            tail -n 200 rector-output.txt
            echo '```'
            echo "</details>"
            echo ""
            echo "[Run complet]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)"
          } > /tmp/comment_body.md
          python3 -c "
          import json
          body = open('/tmp/comment_body.md').read()
          if len(body) > 65000:
              body = body[:65000] + '\n\n...(tronqué)'
          print(json.dumps({'body': body}))
          " > /tmp/comment_payload.json
          curl -s -X POST \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/comments" \
            -d @/tmp/comment_payload.json

  # ── Composer Audit (sécurité dépendances) ────────────────────
  composer-audit:
    name: Composer Audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Setup PHP 8.5
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: sqlite3, pdo_sqlite, mbstring, intl, bcmath, curl, zip, opcache
          coverage: none
          tools: composer

      - name: Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: vendor
          key: composer-${{ runner.os }}-php85-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php85-

      - name: Composer install
        run: composer install --no-interaction --prefer-dist

      - name: Composer audit
        run: composer audit --locked --no-dev 2>&1 | tee composer-audit-output.txt

      - name: Report failure as commit comment
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          {
            echo "### ❌ CI \"Composer Audit\" a échoué — commit \`${GITHUB_SHA::8}\`"
            echo ""
            echo "<details><summary>composer-audit-output.txt</summary>"
            echo ""
            echo '```'
            cat composer-audit-output.txt
            echo '```'
            echo "</details>"
            echo ""
            echo "[Run complet]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)"
          } > /tmp/comment_body.md
          python3 -c "
          import json
          body = open('/tmp/comment_body.md').read()
          if len(body) > 65000:
              body = body[:65000] + '\n\n...(tronqué)'
          print(json.dumps({'body': body}))
          " > /tmp/comment_payload.json
          curl -s -X POST \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/comments" \
            -d @/tmp/comment_payload.json

  # ── Infection (Mutation Testing) ─────────────────────────────
  # MSI target: 80% (minMsi dans infection.json)
  # Timeout: 120 min — mutation testing est lent mais utile
  infection:
    name: Infection MSI
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    defaults:
      run:
        shell: bash --noprofile --norc -eo pipefail {0}
    steps:
      - uses: actions/checkout@v5

      - name: Setup PHP 8.5
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: sqlite3, pdo_sqlite, mbstring, intl, bcmath, curl, zip, opcache
          coverage: pcov

      - name: Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: vendor
          key: composer-${{ runner.os }}-php85-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php85-

      - name: Composer install
        run: composer install --no-interaction --prefer-dist

      - name: Infection (mutation testing)
        run: php vendor/bin/infection --threads=4 --no-progress 2>&1 | tee infection-output.txt

      - name: Upload infection logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: infection-logs
          path: data/infection*.log
          retention-days: 7

      - name: Report failure as commit comment
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          {
            echo "### ❌ CI \"Infection MSI\" a échoué — commit \`${GITHUB_SHA::8}\`"
            echo ""
            echo "<details><summary>infection-output.txt (dernières 200 lignes)</summary>"
            echo ""
            echo '```'
            tail -n 200 infection-output.txt
            echo '```'
            echo "</details>"
            echo ""
            echo "[Run complet]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)"
          } > /tmp/comment_body.md
          python3 -c "
          import json
          body = open('/tmp/comment_body.md').read()
          if len(body) > 65000:
              body = body[:65000] + '\n\n...(tronqué)'
          print(json.dumps({'body': body}))
          " > /tmp/comment_payload.json
          curl -s -X POST \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/comments" \
            -d @/tmp/comment_payload.json
